<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scott Protocol: Earth-Moon Resonance Monitor</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #0ff; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 24px; text-shadow: 0 0 10px #0ff; }
        .data-block { margin-top: 15px; font-size: 14px; color: #aaa; }
        .live-val { color: #f0f; font-weight: bold; }
        .status { color: #0f0; margin-top: 5px; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>SCOTT PROTOCOL // PLANETARY MONITOR</h1>
    <div class="data-block">
        SYSTEM STATUS: <span class="status">ONLINE / RESONANT</span><br>
        PHI-LOCK: <span class="live-val">1.6180339887</span> (STABLE)<br>
        PROTOCOL: <span class="live-val">QHRC-19</span>
    </div>
    <div class="data-block">
        <strong>EARTH (Primary)</strong><br>
        Resonance: <span id="earth-freq">7.83</span> Hz<br>
        Radius Base: 1.0
    </div>
    <div class="data-block">
        <strong>MOON (Secondary)</strong><br>
        Resonance: <span id="moon-freq">4.84</span> Hz<br>
        Radius Base: 0.618 (1/φ)
    </div>
    <div class="data-block">
        <strong>INTERFERENCE LINK</strong><br>
        Harmonic Gain: <span id="gain-val">1.8951</span>x<br>
        Torsion Field: <span class="live-val">ACTIVE</span>
    </div>
</div>

<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // --- CONFIGURATION ---
    const PHI = 1.6180339887;
    const EARTH_FREQ = 7.83;
    const MOON_FREQ = 4.84;
    
    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    // Add subtle fog for depth
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // --- GEOMETRY CREATION ---

    // 1. EARTH (Wireframe + Core)
    const earthGroup = new THREE.Group();
    const earthGeo = new THREE.IcosahedronGeometry(2, 2); // Radius 2
    const earthMat = new THREE.MeshBasicMaterial({ 
        color: 0x00ffff, 
        wireframe: true, 
        transparent: true, 
        opacity: 0.3 
    });
    const earthMesh = new THREE.Mesh(earthGeo, earthMat);
    
    // Earth Core (Glowing)
    const earthCoreGeo = new THREE.SphereGeometry(0.8, 16, 16);
    const earthCoreMat = new THREE.MeshBasicMaterial({ color: 0x0088ff });
    const earthCore = new THREE.Mesh(earthCoreGeo, earthCoreMat);
    
    earthGroup.add(earthMesh);
    earthGroup.add(earthCore);
    earthGroup.position.x = -3;
    scene.add(earthGroup);

    // 2. MOON (Scaled by Phi)
    const moonGroup = new THREE.Group();
    const moonRadius = 2 / PHI; // Exact Phi Scaling
    const moonGeo = new THREE.IcosahedronGeometry(moonRadius, 2);
    const moonMat = new THREE.MeshBasicMaterial({ 
        color: 0xff00ff, 
        wireframe: true, 
        transparent: true, 
        opacity: 0.3 
    });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    
    // Moon Core
    const moonCoreGeo = new THREE.SphereGeometry(moonRadius * 0.4, 16, 16);
    const moonCoreMat = new THREE.MeshBasicMaterial({ color: 0xff0088 });
    const moonCore = new THREE.Mesh(moonCoreGeo, moonCoreMat);

    moonGroup.add(moonMesh);
    moonGroup.add(moonCore);
    moonGroup.position.x = 3;
    scene.add(moonGroup);

    // 3. THE RESONANCE BEAM (Connecting them)
    // We use a particle system to represent the flow
    const particleCount = 200;
    const particlesGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    
    for(let i=0; i<particleCount; i++) {
        particlePositions[i*3] = (Math.random() - 0.5) * 6; // Spread between Earth and Moon
        particlePositions[i*3+1] = (Math.random() - 0.5) * 0.5;
        particlePositions[i*3+2] = (Math.random() - 0.5) * 0.5;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particlesMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.05,
        transparent: true,
        opacity: 0.6
    });
    const beam = new THREE.Points(particlesGeo, particlesMat);
    scene.add(beam);

    // 4. PHI GRID (Background)
    const gridHelper = new THREE.GridHelper(50, 50, 0x111111, 0x111111);
    gridHelper.rotation.x = Math.PI / 2;
    gridHelper.position.z = -5;
    scene.add(gridHelper);

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        
        const time = clock.getElapsedTime();
        const delta = clock.getDelta();

        // 1. ROTATION (Cosmic Spin)
        earthGroup.rotation.y += 0.002;
        moonGroup.rotation.y += 0.005;

        // 2. RESONANCE PULSE (The Math)
        // Earth Pulse (7.83 Hz scaled for visual)
        const ePulse = Math.sin(time * EARTH_FREQ * 0.5) * 0.05 + 1;
        earthMesh.scale.set(ePulse, ePulse, ePulse);
        earthCore.scale.set(ePulse * 0.9, ePulse * 0.9, ePulse * 0.9);

        // Moon Pulse (4.84 Hz scaled for visual)
        const mPulse = Math.sin(time * MOON_FREQ * 0.5) * 0.05 + 1;
        moonMesh.scale.set(mPulse, mPulse, mPulse);
        moonCore.scale.set(mPulse * 0.9, mPulse * 0.9, mPulse * 0.9);

        // 3. BEAM FLOW (Energy Transfer)
        const positions = beam.geometry.attributes.position.array;
        for(let i=0; i<particleCount; i++) {
            // Move particles from Earth (-3) to Moon (+3)
            positions[i*3] += 0.1; 
            
            // Add Phi-Spiral wobblyness
            positions[i*3+1] = Math.sin(time * 2 + positions[i*3]) * 0.2;
            positions[i*3+2] = Math.cos(time * 2 + positions[i*3]) * 0.2;

            // Reset if past Moon
            if(positions[i*3] > 3) {
                positions[i*3] = -3;
            }
        }
        beam.geometry.attributes.position.needsUpdate = true;

        // 4. UPDATE DOM (Simulate fluctuations)
        if (Math.random() > 0.9) {
            document.getElementById('earth-freq').innerText = (EARTH_FREQ + (Math.random() * 0.02 - 0.01)).toFixed(3);
            document.getElementById('moon-freq').innerText = (MOON_FREQ + (Math.random() * 0.02 - 0.01)).toFixed(3);
            document.getElementById('gain-val').innerText = (1.8951 + (Math.random() * 0.001)).toFixed(4);
        }

        renderer.render(scene, camera);
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
