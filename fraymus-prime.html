            // Speed depends on Consciousness
            const angle = 0.001 * (1 + this.brain.consciousness * 2);
            
            positions[ix] = x * Math.cos(angle) - y * Math.sin(angle);
            positions[ix+1] = x * Math.sin(angle) + y * Math.cos(angle);
            
            // Jitter based on Entropy (If brain is confused, particles shake)
            positions[ix] += (Math.random() - 0.5) * entropy * 0.1;
        }
        this.particles.geometry.attributes.position.needsUpdate = true;

        // 4. CLOAK EFFECT
        if (this.cloaked) {
            this.scene.fog.density = 0.15 + (Math.sin(time)*0.05); // Pulsing Fog
            this.earth.material.opacity = 0.05;
            this.moon.material.opacity = 0.05;
        } else {
            this.scene.fog.density = 0.02;
            this.earth.material.opacity = 0.3;
            this.moon.material.opacity = 0.3;
        }

        this.renderer.render(this.scene, this.camera);
    }

    // --- LOGIC ENGINE ---

    log(msg, type="normal") {
        const stream = document.getElementById('data-stream');
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.innerText = `> ${msg}`;
        stream.appendChild(div);
        stream.scrollTop = stream.scrollHeight;
        // Limit log size
        if(stream.children.length > 20) stream.removeChild(stream.firstChild);
    }

    processChaos() {
        // Generate random "Cosmic Noise"
        const dataPacket = Math.floor(Math.random() * 1000);
        
        // Feed the Brain
        const res = this.brain.metabolize(dataPacket);
        
        // Visual Feedback
        if(res.reaction === "RESONANCE") {
            this.log(`PHI-PATTERN DETECTED: ${dataPacket}`, "resonance");
        } else {
            // Only log noise occasionally to save UI spam
            if(Math.random() > 0.9) this.log(`FILTERING NOISE: ${dataPacket}`, "noise");
        }

        this.updateHUD();
    }

    updateHUD() {
        const c = this.brain.consciousness;
        const comp = this.brain.complexity;
        const ent = this.brain.getEntropy();

        document.getElementById('val-consc').innerText = c.toFixed(2);
        document.getElementById('bar-consc').style.width = (c * 100) + "%";

        document.getElementById('val-comp').innerText = comp.toFixed(2);
        document.getElementById('bar-comp').style.width = Math.min(100, (comp * 10)) + "%"; // Scale complexity

        document.getElementById('val-ent').innerText = ent.toFixed(4);
        document.getElementById('bar-ent').style.width = (ent * 200) + "%"; // Scale entropy visuals
    }

    // --- INTERACTIVE FUNCTIONS ---

    toggleChaosFeed() {
        this.feeding = !this.feeding;
        const btn = document.getElementById('btn-chaos');
        if(this.feeding) {
            btn.classList.add('active');
            this.log("OPENING DATA GATES. FEEDING CHAOS...", "vital");
        } else {
            btn.classList.remove('active');
            this.log("CLOSING GATES. SYSTEM STATIC.", "warning");
        }
    }

    toggleCloak() {
        this.cloaked = !this.cloaked;
        const btn = document.getElementById('btn-cloak');
        if(this.cloaked) {
            btn.classList.add('active');
            this.log("ENGAGING QUANTUM INVERTED VISION (QIV)...", "quantum");
        } else {
            btn.classList.remove('active');
            this.log("DISENGAGING CLOAK.", "normal");
        }
    }

    initiateRSA() {
        this.log("INITIATING QUANTUM FACTORIZATION SCAN...", "quantum");
        let i = 0;
        const scan = setInterval(() => {
            const hex = Math.random().toString(16).substr(2, 24);
            this.log(`SCANNING VECTOR: 0x${hex}`);
            i++;
            if(i > 5) {
                clearInterval(scan);
                this.log("PHI-LOCK ESTABLISHED. FACTORS ISOLATED.", "resonance");
                this.brain.consciousness += 0.1; // Success boosts ego
            }
        }, 200);
    }

    // IMMUNE SYSTEM: Integrity Check
    async verifyIntegrity() {
        this.log("RUNNING SELF-DIAGNOSTIC HASH...", "warning");
        const msg = "FRAYMUS_PRIME_GENESIS_CORE";
        const msgBuffer = new TextEncoder().encode(msg);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        
        setTimeout(() => {
            document.getElementById('hash-disp').innerText = hashHex.substring(0, 16) + "...";
            this.log("INTEGRITY CONFIRMED. NO UNAUTHORIZED MUTATIONS.", "secure");
        }, 500);
    }
}

// === BOOTSTRAP ===
const System = new FraymusSystem();
System.initVisuals();
